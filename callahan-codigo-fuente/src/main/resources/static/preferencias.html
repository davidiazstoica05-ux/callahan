<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callahan - Calibrando Algoritmo</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/preferencias.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/preferencias.js" defer></script>
</head>
<body>

<main class="pantalla-preferencias">

    <header class="cabecera-preferencias">
        <h1>Calibrando Algoritmo</h1>
        <p>Evalúa los siguientes expedientes para ajustar tus criterios de recomendación.</p>
    </header>

    <!--Recordar añadir un contador para saber cuantas peliculas van-->
    <section class="contenedor-tarjeta">
        <div id="tarjeta-pelicula" class="tarjeta-saul-bass">
            <img id="poster-pelicula" src="https://via.placeholder.com/300x400?text=Cargando+Expediente..." alt="Póster del archivo cinematográfico">
            <div class="info-pelicula">
                <h2 id="titulo-pelicula">Buscando película...</h2>
                <p id="director-pelicula">Director (Año)</p>
            </div>
        </div>
    </section>

    <footer class="controles-swipe">
        <button id="btn-rechazar" class="btn-accion btn-rojo" aria-label="No me gusta">
            <i class="bi bi-x-lg"></i>
        </button>
        <button id="btn-ignorar" class="btn-accion btn-gris" aria-label="No la he visto">
            <i class="bi bi-question-lg"></i>
        </button>
        <button id="btn-gustar" class="btn-accion btn-verde" aria-label="Me gusta">
            <i class="bi bi-heart-fill"></i>
        </button>
    </footer>

    <div class="leyenda-controles">
        <span>Rechazar</span>
        <span>No vista</span>
        <span>Me gusta</span>
    </div>

</main>

</body>
</html>
