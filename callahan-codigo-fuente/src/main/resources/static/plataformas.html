<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callahan - Recursos de Investigación</title>
    <!-- Reutilizamos tus hojas de estilo existentes para mantener la coherencia -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/interrogatorio.css">
    <script src="js/plataformas.js" defer></script>
</head>
<body>

    <div id="pantalla-interrogatorio">
        <h2>Fuentes de Información</h2>
        <div class="subtitulo">¿En qué plataformas de streaming tienes jurisdicción?</div>

        <form id="formulario-plataformas">

            <div class="cuadricula-emociones">
                <label>
                    <input type="checkbox" name="plataforma" value="NETFLIX" class="checkbox-emocion">
                    <span class="emocion-label">Netflix</span>
                </label>
                <label>
                    <input type="checkbox" name="plataforma" value="PRIME_VIDEO" class="checkbox-emocion">
                    <span class="emocion-label">Prime Video</span>
                </label>
                <label>
                    <input type="checkbox" name="plataforma" value="MAX" class="checkbox-emocion">
                    <span class="emocion-label">Max (HBO)</span>
                </label>
                <label>
                    <input type="checkbox" name="plataforma" value="DISNEY_PLUS" class="checkbox-emocion">
                    <span class="emocion-label">Disney+</span>
                </label>
                <label>
                    <input type="checkbox" name="plataforma" value="FILMIN" class="checkbox-emocion">
                    <span class="emocion-label">Filmin</span>
                </label>
                <label>
                    <input type="checkbox" name="plataforma" value="APPLE_TV" class="checkbox-emocion">
                    <span class="emocion-label">Apple TV+</span>
                </label>
            </div>

            <button type="submit" class="btn-accion">Guardar e Investigar</button>
        </form>
    </div>
</body>
</html>
